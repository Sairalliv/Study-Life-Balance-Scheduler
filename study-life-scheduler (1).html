<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study-Life Balance Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FDFAF4;
    --surface: #FFFFFF;
    --surface2: #F5F1E8;
    --border: #E5E0D3;
    --border2: #D5CFBF;
    --text: #1A1814;
    --text2: #6B6357;
    --text3: #9C9287;

    --study: #2E6DA4;      --study-bg: #EAF2FB;  --study-t: #1A4D7A;
    --life: #C4572A;       --life-bg: #FBF0EB;   --life-t: #8C3A18;
    --health: #3F7A2E;     --health-bg: #EBF5E8; --health-t: #265219;
    --social: #6B5FCC;     --social-bg: #F0EEFB; --social-t: #4A3FA3;
    --rest: #A07820;       --rest-bg: #FBF4E3;   --rest-t: #705410;

    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,.07), 0 4px 12px rgba(0,0,0,.05);
    --shadow-md: 0 4px 16px rgba(0,0,0,.10), 0 1px 4px rgba(0,0,0,.06);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, var(--study), var(--social));
  }
  .topbar-right { display: flex; align-items: center; gap: 10px; }

  /* ── MAIN LAYOUT ── */
  .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem 2rem; }
  .layout { display: grid; grid-template-columns: 1fr 260px; gap: 1.25rem; align-items: start; }

  /* ── BUTTONS ── */
  .btn {
    border-radius: var(--radius-sm); padding: 7px 14px; font-size: 13px;
    font-family: 'DM Sans', sans-serif; cursor: pointer; font-weight: 500;
    transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-ghost {
    background: none; border: 1px solid var(--border2); color: var(--text2);
  }
  .btn-ghost:hover { background: var(--surface2); }
  .btn-primary {
    background: var(--text); color: var(--bg); border: none;
  }
  .btn-primary:hover { opacity: .85; }
  .btn-icon {
    width: 32px; height: 32px; padding: 0; justify-content: center;
    background: none; border: 1px solid var(--border2); color: var(--text2);
    border-radius: var(--radius-sm);
  }
  .btn-icon:hover { background: var(--surface2); }

  /* ── VIEW TOGGLE ── */
  .view-toggle { display: flex; border: 1px solid var(--border2); border-radius: var(--radius-sm); overflow: hidden; }
  .view-btn {
    padding: 6px 14px; font-size: 12px; font-weight: 500; cursor: pointer;
    border: none; background: none; color: var(--text2); font-family: 'DM Sans', sans-serif;
    transition: all .15s;
  }
  .view-btn.active { background: var(--text); color: var(--bg); }

  /* ── CONTROLS ── */
  .cal-controls {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1rem; gap: 10px;
  }
  .cal-controls-left { display: flex; align-items: center; gap: 8px; }
  .cal-controls-right { display: flex; align-items: center; gap: 8px; }
  .month-label {
    font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 500;
    min-width: 200px; color: var(--text);
  }

  /* ── CARD ── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .card-inner { padding: 1.1rem; }
  .card-title {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .07em; color: var(--text3); margin-bottom: 10px;
  }

  /* ── MONTH CALENDAR ── */
  .day-names {
    display: grid; grid-template-columns: repeat(7,1fr);
    border-bottom: 1px solid var(--border);
  }
  .day-name {
    text-align: center; padding: 8px 0; font-size: 10px; font-weight: 600;
    color: var(--text3); text-transform: uppercase; letter-spacing: .06em;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); }
  .cal-cell {
    min-height: 88px; border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border); padding: 6px;
    cursor: pointer; transition: background .12s; position: relative;
  }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell:last-child, .cal-cell:nth-last-child(-n+7) { }
  .cal-cell:hover { background: var(--surface2); }
  .cal-cell.other-month { opacity: .3; pointer-events: none; }
  .cal-cell.is-today .dn {
    background: var(--text); color: var(--bg);
    border-radius: 50%; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-cell.is-selected { background: #F0EDE5; }
  .dn {
    font-size: 11px; font-weight: 500; color: var(--text2);
    width: 22px; height: 22px; display: flex; align-items: center;
    justify-content: center; margin-bottom: 4px;
  }
  .edot {
    font-size: 10px; border-radius: 4px; padding: 1px 5px;
    margin-bottom: 2px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; font-weight: 500; line-height: 1.5;
  }
  .edot.study  { background:var(--study-bg); color:var(--study-t); }
  .edot.life   { background:var(--life-bg);  color:var(--life-t);  }
  .edot.health { background:var(--health-bg);color:var(--health-t);}
  .edot.social { background:var(--social-bg);color:var(--social-t);}
  .edot.rest   { background:var(--rest-bg);  color:var(--rest-t);  }

  /* ── WEEK VIEW ── */
  .week-head {
    display: grid; grid-template-columns: 52px repeat(7,1fr);
    border-bottom: 1px solid var(--border);
  }
  .week-head-cell {
    text-align: center; padding: 10px 4px; cursor: pointer;
    border-right: 1px solid var(--border);
  }
  .week-head-cell:last-child { border-right: none; }
  .whc-day { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; }
  .whc-num { font-size: 20px; font-weight: 500; color: var(--text2); line-height: 1.3; }
  .whc-num.today-n {
    background: var(--text); color: var(--bg); border-radius: 50%;
    width: 34px; height: 34px; display: flex; align-items: center;
    justify-content: center; margin: 0 auto; font-size: 17px;
  }
  .week-body { display: flex; overflow-y: auto; max-height: 500px; }
  .time-col { width: 52px; flex-shrink: 0; border-right: 1px solid var(--border); }
  .time-slot {
    height: 52px; display: flex; align-items: flex-start; justify-content: flex-end;
    padding: 3px 8px 0 0;
  }
  .time-slot span { font-size: 10px; color: var(--text3); font-weight: 500; }
  .week-cols { display: grid; grid-template-columns: repeat(7,1fr); flex: 1; }
  .week-col {
    position: relative; border-right: 1px solid var(--border); cursor: pointer;
  }
  .week-col:last-child { border-right: none; }
  .hour-row { height: 52px; border-bottom: 1px solid var(--border); }
  .half-line {
    position: absolute; width: 100%; height: 1px;
    background: var(--border); opacity: .5; pointer-events: none;
  }
  .week-event {
    position: absolute; left: 2px; right: 2px; border-radius: 5px;
    padding: 3px 5px; font-size: 10px; font-weight: 500; overflow: hidden;
    cursor: pointer; z-index: 1; border-left: 3px solid;
    transition: opacity .12s;
  }
  .week-event:hover { opacity: .85; }
  .week-event.study  { background:var(--study-bg); color:var(--study-t); border-color:var(--study); }
  .week-event.life   { background:var(--life-bg);  color:var(--life-t);  border-color:var(--life); }
  .week-event.health { background:var(--health-bg);color:var(--health-t);border-color:var(--health);}
  .week-event.social { background:var(--social-bg);color:var(--social-t);border-color:var(--social);}
  .week-event.rest   { background:var(--rest-bg);  color:var(--rest-t);  border-color:var(--rest); }

  /* ── SIDEBAR ── */
  .sidebar { display: flex; flex-direction: column; gap: .9rem; }

  .score-wrap { text-align: center; padding: .2rem 0 .5rem; }
  .score-num { font-family: 'Playfair Display', serif; font-size: 44px; font-weight: 500; color: var(--text); line-height: 1; }
  .score-label { font-size: 12px; font-weight: 500; color: var(--text2); margin-top: 2px; }
  .score-track { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .score-fill { height: 100%; border-radius: 3px; background: var(--text); transition: width .6s ease; }

  .bal-row { margin-bottom: 9px; }
  .bal-labels { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .bal-name { font-size: 12px; font-weight: 500; color: var(--text); }
  .bal-stat { font-size: 11px; color: var(--text3); }
  .bal-track { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .bal-fill { height: 100%; border-radius: 2px; transition: width .5s ease; }
  .bal-fill.study  { background:var(--study); }
  .bal-fill.life   { background:var(--life); }
  .bal-fill.health { background:var(--health); }
  .bal-fill.social { background:var(--social); }
  .bal-fill.rest   { background:var(--rest); }

  .tip-row { display: flex; gap: 9px; margin-bottom: 8px; align-items: flex-start; }
  .tip-icon { font-size: 13px; color: var(--text3); flex-shrink: 0; margin-top: 1px; }
  .tip-text { font-size: 12px; color: var(--text2); line-height: 1.55; }

  /* ── DAY PANEL ── */
  .dpanel-head {
    font-size: 13px; font-weight: 500; color: var(--text);
    margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
  }
  .add-here-btn {
    font-size: 11px; color: var(--text3); background: none; border: none;
    cursor: pointer; display: flex; align-items: center; gap: 3px;
    font-family: 'DM Sans', sans-serif; font-weight: 500;
    transition: color .12s;
  }
  .add-here-btn:hover { color: var(--text); }
  .day-ev {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 9px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); margin-bottom: 5px;
  }
  .dev-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
  .dev-dot.study  { background:var(--study); }
  .dev-dot.life   { background:var(--life); }
  .dev-dot.health { background:var(--health); }
  .dev-dot.social { background:var(--social); }
  .dev-dot.rest   { background:var(--rest); }
  .dev-info { flex: 1; min-width: 0; }
  .dev-title { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-time { font-size: 11px; color: var(--text3); }
  .del-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text3); font-size: 13px; display: flex; align-items: center;
    padding: 2px; opacity: .5; transition: opacity .12s;
  }
  .del-btn:hover { opacity: 1; color: #C0392B; }
  .empty-day { font-size: 12px; color: var(--text3); text-align: center; padding: 14px 0; }

  /* ── MODAL ── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20,16,10,.45);
    z-index: 200; display: flex; align-items: center; justify-content: center;
    padding: 1rem;
  }
  .modal {
    background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow-md); width: 100%; max-width: 420px;
    padding: 1.6rem; animation: fadeUp .18s ease;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem;
  }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 500; }
  .modal-close {
    background: none; border: none; cursor: pointer; color: var(--text3);
    font-size: 18px; display: flex; align-items: center;
  }
  .modal-close:hover { color: var(--text); }
  .form-group { margin-bottom: 13px; }
  .form-label {
    display: block; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; color: var(--text3); margin-bottom: 5px;
  }
  input[type=text], input[type=date], input[type=time], select, textarea {
    width: 100%; border: 1px solid var(--border2); border-radius: var(--radius-sm);
    padding: 8px 11px; font-family: 'DM Sans', sans-serif; font-size: 13px;
    color: var(--text); background: var(--bg); outline: none;
    transition: border-color .15s;
  }
  input:focus, select:focus { border-color: var(--text); }
  .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .cat-pill {
    border: 1px solid var(--border2); border-radius: 20px;
    padding: 5px 12px; font-size: 12px; font-weight: 500;
    cursor: pointer; color: var(--text2); background: none;
    font-family: 'DM Sans', sans-serif; transition: all .12s;
  }
  .cat-pill.active.study  { background:var(--study-bg); border-color:var(--study); color:var(--study-t); }
  .cat-pill.active.life   { background:var(--life-bg);  border-color:var(--life);  color:var(--life-t); }
  .cat-pill.active.health { background:var(--health-bg);border-color:var(--health);color:var(--health-t);}
  .cat-pill.active.social { background:var(--social-bg);border-color:var(--social);color:var(--social-t);}
  .cat-pill.active.rest   { background:var(--rest-bg);  border-color:var(--rest);  color:var(--rest-t); }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 1.3rem; }

  /* ── EXPORT ── */
  .export-bar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: .75rem 1.1rem;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1rem; flex-wrap: wrap; gap: 8px;
  }
  .export-info { font-size: 12px; color: var(--text2); }
  .export-info strong { color: var(--text); }
  .export-actions { display: flex; gap: 8px; }

  /* ── LEGEND ── */
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: .75rem; }
  .leg-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .leg-dot.study  { background:var(--study); }
  .leg-dot.life   { background:var(--life); }
  .leg-dot.health { background:var(--health); }
  .leg-dot.social { background:var(--social); }
  .leg-dot.rest   { background:var(--rest); }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 9px 18px;
    border-radius: 20px; font-size: 13px; font-weight: 500;
    z-index: 999; pointer-events: none; opacity: 0;
    transition: opacity .25s;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .container { padding: 1rem; }
    .topbar { padding: 0 1rem; }
  }
</style>
</head>
<body>

<nav class="topbar">
  <div class="brand">
    <div class="brand-dot"></div>
    Balance Planner
  </div>
  <div class="topbar-right">
    <button class="btn btn-ghost" onclick="exportJSON()"><i class="fas fa-download"></i> Export</button>
    <label class="btn btn-ghost" style="cursor:pointer"><i class="fas fa-upload"></i> Import <input type="file" accept=".json" onchange="importJSON(event)" style="display:none"/></label>
    <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Add event</button>
  </div>
</nav>

<div class="container">
  <div class="export-bar">
    <div class="export-info">
      <strong id="event-count">0</strong> events scheduled &nbsp;·&nbsp; Balance score: <strong id="score-inline">—</strong>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <!-- Controls -->
  <div class="cal-controls">
    <div class="cal-controls-left">
      <button class="btn btn-icon" onclick="navPrev()"><i class="fas fa-chevron-left"></i></button>
      <button class="btn btn-icon" onclick="navNext()"><i class="fas fa-chevron-right"></i></button>
      <span class="month-label" id="period-label"></span>
      <button class="btn btn-ghost" onclick="goToday()" style="padding:6px 10px;font-size:12px;">Today</button>
    </div>
    <div class="cal-controls-right">
      <div class="view-toggle">
        <button class="view-btn active" id="btn-month" onclick="switchView('month')">Month</button>
        <button class="view-btn" id="btn-week" onclick="switchView('week')">Week</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <div>
      <!-- Month view -->
      <div id="month-view" class="card"></div>
      <!-- Week view -->
      <div id="week-view" class="card" style="display:none;"></div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="card card-inner" id="score-panel"></div>
      <div class="card card-inner" id="balance-panel"></div>
      <div class="card card-inner" id="tips-panel"></div>
      <div class="card card-inner" id="day-panel"></div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modal" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Add event</div>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="form-group">
      <label class="form-label">Title</label>
      <input type="text" id="f-title" placeholder="e.g. Study session" onkeydown="if(event.key==='Enter')saveEvent()" />
    </div>
    <div class="form-group">
      <label class="form-label">Category</label>
      <div class="cat-pills" id="cat-pills"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Date</label>
      <input type="date" id="f-date" />
    </div>
    <div class="form-group">
      <label class="form-label">Time</label>
      <div class="time-grid">
        <div><label class="form-label" style="margin-bottom:3px;">Start</label><input type="time" id="f-start" value="09:00"/></div>
        <div><label class="form-label" style="margin-bottom:3px;">End</label><input type="time" id="f-end" value="10:00"/></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEvent()"><i class="fas fa-check"></i> Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─── DATA ─────────────────────────────────────────── */
const CATS = [
  {key:'study',  label:'Study'},
  {key:'life',   label:'Life'},
  {key:'health', label:'Health'},
  {key:'social', label:'Social'},
  {key:'rest',   label:'Rest'},
];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const HOURS = Array.from({length:17},(_,i)=>i+7);

const SAMPLE = [
  {id:1,  date:'2026-05-26', title:'Linear Algebra',      cat:'study',  start:'09:00', end:'11:00'},
  {id:2,  date:'2026-05-26', title:'Morning run',          cat:'health', start:'07:00', end:'08:00'},
  {id:3,  date:'2026-05-27', title:'Group study session',  cat:'study',  start:'14:00', end:'16:00'},
  {id:4,  date:'2026-05-27', title:'Grocery & errands',    cat:'life',   start:'10:00', end:'11:30'},
  {id:5,  date:'2026-05-28', title:'Movie night',          cat:'social', start:'19:00', end:'21:00'},
  {id:6,  date:'2026-05-28', title:'Nap & downtime',       cat:'rest',   start:'13:00', end:'14:30'},
  {id:7,  date:'2026-05-29', title:'Calculus review',      cat:'study',  start:'10:00', end:'13:00'},
  {id:8,  date:'2026-05-30', title:'Yoga class',           cat:'health', start:'08:00', end:'09:00'},
  {id:9,  date:'2026-05-22', title:'Essay writing',        cat:'study',  start:'09:00', end:'12:00'},
  {id:10, date:'2026-05-23', title:'Family dinner',        cat:'social', start:'18:00', end:'20:00'},
  {id:11, date:'2026-05-20', title:'Gym session',          cat:'health', start:'17:00', end:'18:30'},
  {id:12, date:'2026-05-19', title:'Physics lab report',   cat:'study',  start:'13:00', end:'16:00'},
  {id:13, date:'2026-05-21', title:'Laundry & chores',     cat:'life',   start:'11:00', end:'12:00'},
  {id:14, date:'2026-05-24', title:'Sunday rest',          cat:'rest',   start:'10:00', end:'12:00'},
  {id:15, date:'2026-05-25', title:'Coffee with friends',  cat:'social', start:'15:00', end:'17:00'},
];

let events = [];
let view = 'month';
let curYear = new Date().getFullYear();
let curMonth = new Date().getMonth();
let weekStart = startOfWeek(toDateStr(new Date()));
let selectedDate = toDateStr(new Date());
let formCat = 'study';
let nextId = 100;

/* ─── INIT ─────────────────────────────────────────── */
function init() {
  const saved = localStorage.getItem('balance_events');
  events = saved ? JSON.parse(saved) : SAMPLE;
  nextId = events.reduce((m,e)=>Math.max(m,e.id),0)+1;
  buildCatPills();
  buildLegend();
  render();
}

function save() {
  localStorage.setItem('balance_events', JSON.stringify(events));
}

/* ─── HELPERS ───────────────────────────────────────── */
function toDateStr(d) { return d.toISOString().slice(0,10); }
function addDays(s, n) { const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return toDateStr(d); }
function startOfWeek(s) { const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()-d.getDay()); return toDateStr(d); }
function timeDiff(s,e) { const[sh,sm]=s.split(':').map(Number);const[eh,em]=e.split(':').map(Number); return Math.max(0,(eh*60+em)-(sh*60+sm))/60; }
function toMin(t) { const[h,m]=t.split(':').map(Number); return h*60+m; }
function fmt12(t) { const[h,m]=t.split(':').map(Number); const ap=h>=12?'pm':'am'; return((h%12)||12)+(m?':'+String(m).padStart(2,'0'):'')+ap; }
function today() { return toDateStr(new Date()); }

function evByDate(dateStr) { return events.filter(e=>e.date===dateStr).sort((a,b)=>a.start.localeCompare(b.start)); }

function computeBalance() {
  const totals = {}; CATS.forEach(c=>totals[c.key]=0);
  events.forEach(e=>{ if(e.start&&e.end) totals[e.cat]=(totals[e.cat]||0)+timeDiff(e.start,e.end); });
  const total = Object.values(totals).reduce((a,b)=>a+b,0);
  return CATS.map(c=>({...c, hrs:totals[c.key], pct:total?Math.round(totals[c.key]/total*100):0}));
}

function computeScore(bal) {
  if(!bal.some(b=>b.pct>0)) return {val:0,label:'No events yet'};
  const ideal=100/5;
  const dev=bal.reduce((a,b)=>a+Math.abs(b.pct-ideal),0)/5;
  const s=Math.max(0,Math.round(100-dev*2));
  const label=s>=80?'Excellent balance':s>=60?'Good balance':s>=40?'Fair balance':'Needs more variety';
  return {val:s,label};
}

/* ─── NAVIGATION ────────────────────────────────────── */
function navPrev() { if(view==='month'){if(curMonth===0){curMonth=11;curYear--;}else curMonth--;} else weekStart=addDays(weekStart,-7); render(); }
function navNext() { if(view==='month'){if(curMonth===11){curMonth=0;curYear++;}else curMonth++;} else weekStart=addDays(weekStart,7); render(); }
function goToday()  { curYear=new Date().getFullYear(); curMonth=new Date().getMonth(); weekStart=startOfWeek(today()); selectedDate=today(); render(); }
function switchView(v) {
  view=v;
  document.getElementById('btn-month').classList.toggle('active',v==='month');
  document.getElementById('btn-week').classList.toggle('active',v==='week');
  document.getElementById('month-view').style.display=v==='month'?'':'none';
  document.getElementById('week-view').style.display=v==='week'?'':'none';
  render();
}

/* ─── RENDER ────────────────────────────────────────── */
function render() {
  renderPeriodLabel();
  if(view==='month') renderMonth();
  else renderWeek();
  renderSidebar();
  updateTopStats();
}

function renderPeriodLabel() {
  if(view==='month') {
    document.getElementById('period-label').textContent=`${MONTHS[curMonth]} ${curYear}`;
  } else {
    const s=new Date(weekStart+'T12:00:00');
    const eDt=new Date(addDays(weekStart,6)+'T12:00:00');
    if(s.getMonth()===eDt.getMonth())
      document.getElementById('period-label').textContent=`${MONTHS[s.getMonth()]} ${s.getDate()}–${eDt.getDate()}, ${s.getFullYear()}`;
    else
      document.getElementById('period-label').textContent=`${MONTHS[s.getMonth()]} ${s.getDate()} – ${MONTHS[eDt.getMonth()]} ${eDt.getDate()}, ${eDt.getFullYear()}`;
  }
}

function renderMonth() {
  const first=new Date(curYear,curMonth,1);
  const last=new Date(curYear,curMonth+1,0);
  const days=[];
  for(let i=0;i<first.getDay();i++){const d=new Date(curYear,curMonth,-first.getDay()+1+i);days.push({date:toDateStr(d),cur:false});}
  for(let d=1;d<=last.getDate();d++){const dt=new Date(curYear,curMonth,d);days.push({date:toDateStr(dt),cur:true});}
  while(days.length%7!==0){const l=new Date(days[days.length-1].date+'T12:00:00');l.setDate(l.getDate()+1);days.push({date:toDateStr(l),cur:false});}

  let html=`<div class="day-names">${DAYS.map(d=>`<div class="day-name">${d}</div>`).join('')}</div><div class="cal-grid">`;
  days.forEach(({date,cur})=>{
    const evs=evByDate(date);
    const isToday=date===today();
    const isSel=date===selectedDate;
    html+=`<div class="cal-cell${!cur?' other-month':''}${isToday?' is-today':''}${isSel?' is-selected':''}" onclick="selectDate('${date}')">
      <div class="dn">${parseInt(date.slice(-2))}</div>
      ${evs.slice(0,3).map(e=>`<div class="edot ${e.cat}">${e.title}</div>`).join('')}
      ${evs.length>3?`<div style="font-size:9px;color:var(--text3);padding:1px 4px;">+${evs.length-3} more</div>`:''}
    </div>`;
  });
  html+='</div>';
  document.getElementById('month-view').innerHTML=html;
}

function renderWeek() {
  const weekDays=Array.from({length:7},(_,i)=>addDays(weekStart,i));
  let html=`<div class="week-head"><div style="width:52px;border-right:1px solid var(--border);"></div>`;
  weekDays.forEach(d=>{
    const dt=new Date(d+'T12:00:00');
    const isT=d===today();
    html+=`<div class="week-head-cell" onclick="selectDate('${d}')">
      <div class="whc-day">${DAYS[dt.getDay()]}</div>
      <div class="whc-num${isT?' today-n':''}">${dt.getDate()}</div>
    </div>`;
  });
  html+=`</div><div class="week-body">
    <div class="time-col">${HOURS.map(h=>`<div class="time-slot"><span>${h===12?'12pm':h>12?`${h-12}pm`:`${h}am`}</span></div>`).join('')}</div>
    <div class="week-cols">`;
  weekDays.forEach(d=>{
    const dayEvs=evByDate(d);
    html+=`<div class="week-col" onclick="selectDate('${d}')">
      ${HOURS.map((_,i)=>`<div class="hour-row"><div class="half-line" style="top:26px;position:relative;"></div></div>`).join('')}
      ${dayEvs.filter(ev=>{const sh=parseInt(ev.start);return sh>=7&&sh<=23;}).map(ev=>{
        const startMin=toMin(ev.start);
        const endMin=toMin(ev.end);
        const top=(startMin-420)/60*52;
        const height=Math.max(20,(endMin-startMin)/60*52);
        return `<div class="week-event ${ev.cat}" style="top:${top}px;height:${height}px;" onclick="event.stopPropagation();selectDate('${d}')">
          <div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${ev.title}</div>
          ${height>30?`<div style="opacity:.7;font-size:9px;">${fmt12(ev.start)}</div>`:''}
        </div>`;
      }).join('')}
    </div>`;
  });
  html+=`</div></div>`;
  document.getElementById('week-view').innerHTML=html;
}

function renderSidebar() {
  const bal=computeBalance();
  const score=computeScore(bal);

  // Score
  document.getElementById('score-panel').innerHTML=`
    <div class="score-wrap">
      <div class="score-num">${score.val}</div>
      <div class="score-label">${score.label}</div>
      <div class="score-track"><div class="score-fill" style="width:${score.val}%"></div></div>
    </div>`;

  // Balance bars
  document.getElementById('balance-panel').innerHTML=`
    <div class="card-title">Time breakdown</div>
    ${bal.map(b=>`<div class="bal-row">
      <div class="bal-labels"><span class="bal-name">${b.label}</span><span class="bal-stat">${b.pct}% · ${b.hrs.toFixed(1)}h</span></div>
      <div class="bal-track"><div class="bal-fill ${b.key}" style="width:${b.pct}%"></div></div>
    </div>`).join('')}`;

  // Tips
  const sorted=[...bal].sort((a,b)=>a.pct-b.pct);
  const low=sorted[0]; const high=sorted[sorted.length-1];
  const tips=[];
  if(high.pct>50) tips.push({icon:'fa-triangle-exclamation',text:`Heavy <strong>${high.label}</strong> load. Try balancing with other activities.`});
  if(low.pct<8)   tips.push({icon:'fa-lightbulb',text:`<strong>${low.label}</strong> time is very low. Even a little goes a long way.`});
  if(!tips.length) tips.push({icon:'fa-face-smile',text:'Great spread across all 5 categories. Keep it balanced!'});
  document.getElementById('tips-panel').innerHTML=`
    <div class="card-title">Insights</div>
    ${tips.map(t=>`<div class="tip-row"><i class="fas ${t.icon} tip-icon"></i><span class="tip-text">${t.text}</span></div>`).join('')}`;

  // Day panel
  const dayEvs=evByDate(selectedDate);
  const label=selectedDate?new Date(selectedDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):'Select a day';
  document.getElementById('day-panel').innerHTML=`
    <div class="dpanel-head">
      ${label}
      <button class="add-here-btn" onclick="openModal('${selectedDate}')"><i class="fas fa-plus"></i> Add</button>
    </div>
    ${dayEvs.length===0?'<div class="empty-day">No events — tap Add to schedule</div>':
      dayEvs.map(ev=>`<div class="day-ev">
        <div class="dev-dot ${ev.cat}"></div>
        <div class="dev-info">
          <div class="dev-title">${ev.title}</div>
          <div class="dev-time">${fmt12(ev.start)} – ${fmt12(ev.end)}</div>
        </div>
        <button class="del-btn" onclick="deleteEvent(${ev.id})"><i class="fas fa-times"></i></button>
      </div>`).join('')}`;
}

function updateTopStats() {
  const bal=computeBalance();
  const score=computeScore(bal);
  document.getElementById('event-count').textContent=events.length;
  document.getElementById('score-inline').textContent=score.val+'/100';
}

function buildLegend() {
  document.getElementById('legend').innerHTML=CATS.map(c=>`
    <div class="leg-item"><div class="leg-dot ${c.key}"></div>${c.label}</div>`).join('');
}

function buildCatPills() {
  document.getElementById('cat-pills').innerHTML=CATS.map(c=>`
    <button class="cat-pill ${c.key}${c.key===formCat?' active':''}" onclick="setFormCat('${c.key}')">${c.label}</button>`).join('');
}

/* ─── INTERACTIONS ──────────────────────────────────── */
function selectDate(d) {
  selectedDate=d;
  const dt=new Date(d+'T12:00:00');
  curYear=dt.getFullYear(); curMonth=dt.getMonth();
  renderSidebar();
  // Re-highlight selected in month view
  if(view==='month') {
    document.querySelectorAll('.cal-cell.is-selected').forEach(el=>el.classList.remove('is-selected'));
    // re-render is simpler
    renderMonth();
  }
}

function deleteEvent(id) {
  events=events.filter(e=>e.id!==id);
  save(); render(); showToast('Event removed');
}

/* ─── MODAL ─────────────────────────────────────────── */
function openModal(date) {
  document.getElementById('f-title').value='';
  document.getElementById('f-date').value=date||selectedDate||today();
  document.getElementById('f-start').value='09:00';
  document.getElementById('f-end').value='10:00';
  formCat='study';
  buildCatPills();
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>document.getElementById('f-title').focus(),50);
}

function closeModal() { document.getElementById('modal').style.display='none'; }

function setFormCat(cat) {
  formCat=cat;
  document.querySelectorAll('.cat-pill').forEach(el=>{
    el.classList.toggle('active',el.classList.contains(cat));
  });
}

function saveEvent() {
  const title=document.getElementById('f-title').value.trim();
  const date=document.getElementById('f-date').value;
  const start=document.getElementById('f-start').value;
  const end=document.getElementById('f-end').value;
  if(!title){document.getElementById('f-title').focus();return;}
  events.push({id:nextId++, date, title, cat:formCat, start, end});
  save();
  selectedDate=date;
  const dt=new Date(date+'T12:00:00');
  curYear=dt.getFullYear(); curMonth=dt.getMonth();
  if(view==='week') weekStart=startOfWeek(date);
  closeModal();
  render();
  showToast('Event added');
}

/* ─── EXPORT / IMPORT ───────────────────────────────── */
function exportJSON() {
  const data=JSON.stringify(events,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='balance-planner-events.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('Events exported');
}

function importJSON(e) {
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try {
      const data=JSON.parse(ev.target.result);
      if(Array.isArray(data)){
        events=data;
        nextId=events.reduce((m,ev)=>Math.max(m,ev.id),0)+1;
        save(); render(); showToast(`Imported ${data.length} events`);
      }
    } catch(err){ showToast('Invalid file'); }
  };
  reader.readAsText(file);
  e.target.value='';
}

/* ─── TOAST ─────────────────────────────────────────── */
let toastTimer=null;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ─── KEYBOARD ──────────────────────────────────────── */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='n'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) openModal();
});

init();
</script>
</body>
</html>
